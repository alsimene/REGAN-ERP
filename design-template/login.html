<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regan - Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-wrap { display: flex; min-height: 100vh; }
    .login-panel { display: flex; width: 45%; position: relative; overflow: hidden; align-items: flex-end; padding: 48px; }
    .login-form { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 48px; }
    .login-form-inner { width: 100%; max-width: 380px; }
    .show-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: none; border: none; cursor: pointer; font-family: var(--font-body); }
    .show-btn:hover { color: var(--foreground); }
    .divider { display: flex; align-items: center; gap: 16px; margin-top: 32px; }
    .divider-line { flex: 1; height: 1px; background-color: var(--border); }
    .divider-text { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    @media (max-width: 1024px) { .login-panel { display: none; } }
  </style>
</head>
<body>
  <!-- Template nav -->
  <nav class="template-nav">
    <span class="brand">Regan</span>
    <a href="login.html" class="active">Login</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="orders.html">Orders</a>
    <a href="inventory.html">Inventory</a>
    <a href="components.html">Components</a>
  </nav>

  <div class="login-wrap" style="margin-top: 42px;">
    <!-- Left industrial panel -->
    <div class="login-panel industrial-panel">
      <!-- Logo -->
      <div style="position: absolute; top: 0; left: 0; width: 100%; padding: 24px 24px 24px; z-index: 20;">
        <h1 class="font-display" style="font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--panel-text);">Regan</h1>
        <div style="margin-top: 8px; height: 2px; width: 40px; background-color: var(--panel-accent);"></div>
      </div>

      <!-- Forge glow -->
      <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; pointer-events: none; background: radial-gradient(ellipse at 50% 100%, var(--panel-glow) 0%, transparent 70%);"></div>

      <!-- Steel beams -->
      <div class="steel-beam" style="top: -5%; left: 8%; width: 2px; height: 60%; transform: rotate(25deg); transform-origin: top left;"></div>
      <div class="steel-beam" style="top: 10%; right: 15%; width: 2px; height: 70%; transform: rotate(-15deg); transform-origin: top right;"></div>
      <div class="steel-line-h" style="top: 35%;"></div>
      <div class="steel-line-h" style="top: 65%;"></div>

      <!-- Corner bolts -->
      <div class="corner-bolt" style="top: 20px; left: 20px;"></div>
      <div class="corner-bolt" style="top: 20px; right: 20px;"></div>
      <div class="corner-bolt" style="bottom: 20px; left: 20px;"></div>
      <div class="corner-bolt" style="bottom: 20px; right: 20px;"></div>

      <!-- Rivet rows -->
      <div style="position: absolute; top: 24px; left: 0; width: 100%; display: flex; justify-content: space-around; pointer-events: none; padding: 0 32px;">
        <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
      </div>
      <div style="position: absolute; bottom: 24px; left: 0; width: 100%; display: flex; justify-content: space-around; pointer-events: none; padding: 0 32px;">
        <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
      </div>

      <!-- Spark particles -->
      <div style="position: absolute; bottom: 25%; left: 20%; pointer-events: none;">
        <div class="spark" style="width: 3px; height: 3px; left: 0; animation: sparkFloat 2s ease-out infinite; animation-delay: 0s;"></div>
        <div class="spark" style="width: 4px; height: 4px; left: 18px; animation: sparkFloat 2.5s ease-out infinite; animation-delay: 0.6s;"></div>
        <div class="spark" style="width: 2.5px; height: 2.5px; left: 36px; animation: sparkFloat 3s ease-out infinite; animation-delay: 1.2s;"></div>
        <div class="spark" style="width: 3.5px; height: 3.5px; left: 54px; animation: sparkFloat 3.5s ease-out infinite; animation-delay: 1.8s;"></div>
        <div class="spark" style="width: 3px; height: 3px; left: 72px; animation: sparkFloat 4s ease-out infinite; animation-delay: 2.4s;"></div>
      </div>

      <!-- Ember dots -->
      <div style="position: absolute; bottom: 10%; right: 25%; pointer-events: none;">
        <div class="ember" style="left: 0; top: 0; animation: emberPulse 2s ease-in-out infinite; animation-delay: 0s;"></div>
        <div class="ember" style="left: 25px; top: -15px; animation: emberPulse 2.7s ease-in-out infinite; animation-delay: 0.4s;"></div>
        <div class="ember" style="left: 50px; top: -30px; animation: emberPulse 3.4s ease-in-out infinite; animation-delay: 0.8s;"></div>
      </div>

      <!-- Grain texture -->
      <div class="grain-overlay"></div>

      <!-- Panel text -->
      <div class="animate-slide-left" style="position: relative; z-index: 10; padding: 32px; backdrop-filter: blur(4px); background-color: var(--panel-content-bg); border-left: 2px solid var(--panel-content-border);">
        <div style="margin-bottom: 24px; height: 2px; width: 64px; background-color: var(--ember);"></div>
        <p class="font-display" style="font-size: 3rem; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; color: var(--panel-text);">
          Welcome<br><span style="color: var(--panel-accent);">back.</span>
        </p>
        <p class="font-body" style="margin-top: 16px; font-size: 14px; max-width: 300px; line-height: 1.6; color: var(--panel-text-sub); letter-spacing: 0.05em;">
          Sign in to continue where you left off.
        </p>
        <div style="margin-top: 32px; height: 1px; width: 128px; background-color: var(--steel-line);"></div>
      </div>
    </div>

    <!-- Right form panel -->
    <div class="login-form">
      <div class="login-form-inner">
        <div class="animate-fade-up delay-100">
          <h1 class="font-display" style="font-size: 1.875rem; letter-spacing: -0.02em; color: var(--foreground); text-transform: uppercase;">Sign in</h1>
          <p style="margin-top: 8px; color: var(--muted); font-size: 14px;">Enter your credentials to access your account</p>
        </div>

        <form onsubmit="return false" style="margin-top: 40px;" class="space-y-6">
          <!-- Email -->
          <div class="animate-fade-up delay-200">
            <label class="input-label">Email</label>
            <input type="email" class="input" placeholder="you@example.com" value="admin@regan.com">
          </div>

          <!-- Password -->
          <div class="animate-fade-up delay-300">
            <label class="input-label">Password</label>
            <div style="position: relative;">
              <input type="password" class="input" placeholder="••••••••" value="password123" style="padding-right: 48px;">
              <button type="button" class="show-btn">Show</button>
            </div>
          </div>

          <!-- Forgot password -->
          <div class="animate-fade-up delay-300" style="display: flex; justify-content: flex-end;">
            <button type="button" style="font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-family: var(--font-body); transition: color 0.2s ease;">
              Forgot password?
            </button>
          </div>

          <!-- Submit -->
          <div class="animate-fade-up delay-400">
            <button type="submit" class="btn btn-primary w-full" style="padding: 14px; justify-content: center; font-size: 14px;">
              Sign In
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="divider animate-fade-up delay-500">
          <div class="divider-line"></div>
          <span class="divider-text">or</span>
          <div class="divider-line"></div>
        </div>

        <!-- Sign up -->
        <p class="animate-fade-up delay-500" style="margin-top: 32px; text-align: center; font-size: 14px; color: var(--muted);">
          Don't have an account? <a href="#" style="color: var(--accent); font-weight: 500;">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Theme toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? '' : 'dark');
    }
  </script>
</body>
</html>
